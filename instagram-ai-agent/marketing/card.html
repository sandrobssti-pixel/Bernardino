<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Card de vendas — Agente de IA Instagram</title>
<!-- Card 1080x1350 (feed do Instagram, 4:5). Idioma pelo ?lang=pt|es|en.
     Gerar os PNGs: node marketing/gerar-cards.cjs -->
<style>
  @font-face { font-family: Orbitron; font-weight: 700; src: url(fonts/orbitron-latin-700-normal.woff2); }
  @font-face { font-family: Orbitron; font-weight: 800; src: url(fonts/orbitron-latin-800-normal.woff2); }
  @font-face { font-family: Plex; font-weight: 400; src: url(fonts/ibm-plex-sans-latin-400-normal.woff2); }
  @font-face { font-family: Plex; font-weight: 500; src: url(fonts/ibm-plex-sans-latin-500-normal.woff2); }
  @font-face { font-family: Plex; font-weight: 600; src: url(fonts/ibm-plex-sans-latin-600-normal.woff2); }
  @font-face { font-family: Plex; font-weight: 700; src: url(fonts/ibm-plex-sans-latin-700-normal.woff2); }
  @font-face { font-family: PlexMono; font-weight: 500; src: url(fonts/ibm-plex-mono-latin-500-normal.woff2); }
  @font-face { font-family: PlexMono; font-weight: 600; src: url(fonts/ibm-plex-mono-latin-600-normal.woff2); }

  :root {
    --bg: #0B0814; --surface: #161029; --surface-2: #1C1533; --line: #2C2350;
    --ink: #F3EFFC; --ink-soft: #B6ACD4; --ink-faint: #8478A8;
    --violet: #6C4CF1; --violet-2: #A78BFA; --cyan: #22D3EE;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; }
  body {
    background: var(--bg); color: var(--ink); font-family: Plex, sans-serif; overflow: hidden; position: relative;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(110px); opacity: .55; }
  .g1 { width: 620px; height: 620px; background: #6C4CF1; top: -220px; right: -180px; }
  .g2 { width: 520px; height: 520px; background: #0E7490; bottom: -200px; left: -200px; opacity: .45; }
  .grid { position: absolute; inset: 0; opacity: .07;
    background-image: linear-gradient(#A78BFA 1px, transparent 1px), linear-gradient(90deg, #A78BFA 1px, transparent 1px);
    background-size: 54px 54px; mask-image: linear-gradient(180deg, #000 0%, transparent 55%); }

  .card { position: relative; height: 100%; padding: 62px 70px 54px; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .logo { height: 92px; margin-left: -20px; }
  .chip { font-family: PlexMono; font-weight: 600; font-size: 19px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--cyan); border: 1.5px solid rgba(34,211,238,.45); background: rgba(34,211,238,.08); padding: 9px 18px; border-radius: 999px; }

  .kicker { margin-top: 54px; font-family: PlexMono; font-weight: 600; font-size: 22px; letter-spacing: .2em; color: var(--violet-2); text-transform: uppercase; }
  h1 { margin-top: 14px; font-family: Orbitron; font-weight: 800; font-size: 62px; line-height: 1.08; letter-spacing: -.01em; }
  h1 .hl { background: linear-gradient(90deg, #A78BFA, #22D3EE); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lead { margin-top: 22px; font-size: 28px; line-height: 1.4; color: var(--ink-soft); max-width: 900px; }

  ul { list-style: none; margin-top: 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px 20px; }
  li { display: flex; gap: 16px; align-items: flex-start; background: rgba(28,21,51,.78); border: 1px solid var(--line);
    border-radius: 20px; padding: 28px 22px; font-size: 24px; line-height: 1.3; font-weight: 500; }
  li .ic { flex: none; width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; font-size: 29px;
    background: linear-gradient(135deg, rgba(108,76,241,.35), rgba(34,211,238,.22)); border: 1px solid rgba(167,139,250,.35); }
  li b { display: block; font-weight: 700; color: var(--ink); }
  li span.d { display: block; margin-top: 3px; color: var(--ink-soft); font-weight: 400; font-size: 20.5px; }

  .price { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; border-radius: 24px; overflow: hidden;
    border: 1.5px solid transparent;
    background: linear-gradient(var(--surface), var(--surface)) padding-box, linear-gradient(90deg, #6C4CF1, #22D3EE) border-box; }
  .price > div { padding: 30px 32px 28px; }
  .price > div + div { border-left: 1px solid var(--line); background: rgba(108,76,241,.10); }
  .plabel { font-family: PlexMono; font-weight: 600; font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
  .pval { margin-top: 6px; font-family: Orbitron; font-weight: 800; font-size: 54px; line-height: 1; white-space: nowrap; }
  .pval small { font-family: Plex; font-weight: 600; font-size: 24px; color: var(--ink-soft); margin-left: 4px; }
  .pnote { margin-top: 8px; font-size: 19px; color: var(--ink-soft); }

  .foot { margin-top: 30px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px 40px;
    font-family: PlexMono; font-weight: 500; font-size: 21px; color: var(--ink-soft); }
  .foot span { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .foot svg { width: 24px; height: 24px; stroke: var(--cyan); fill: none; stroke-width: 1.8; flex: none; }
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div>
<div class="card">
  <div class="top">
    <img class="logo" src="logo.png" alt="Confianza Technologies">
    <div class="chip" id="chip"></div>
  </div>
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
  <ul id="features"></ul>
  <div class="price">
    <div><div class="plabel" id="setupLabel"></div><div class="pval" id="setupVal"></div><div class="pnote" id="setupNote"></div></div>
    <div><div class="plabel" id="monthLabel"></div><div class="pval" id="monthVal"></div><div class="pnote" id="monthNote"></div></div>
  </div>
  <div class="foot">
    <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>confiancatechnologies.com</span>
    <span><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="#22D3EE"/></svg>@confiancatechnologies</span>
    <span><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg>confianzatechnologies@gmail.com</span>
  </div>
</div>
<script>
const T = {
  pt: {
    chip: "24h · 7 dias", kicker: "Agente de IA para Instagram",
    title: 'Seu Instagram <span class="hl">atendendo e vendendo</span> 24 horas',
    lead: "Uma inteligência artificial treinada no seu negócio responde clientes no Direct e nos comentários — na hora, todos os dias.",
    features: [
      ["💬", "Respostas no Direct", "Conhece seus produtos e preços"],
      ["👋", "Boas-vindas automáticas", "Para cada novo contato"],
      ["💭", "Comentários respondidos", "E convite para o Direct"],
      ["🎯", "Captação de leads", "Nome, interesse e histórico"],
      ["📲", "Atendimento humano", "Envia para o seu WhatsApp"],
      ["📊", "Painel completo", "Conversas, leads e relatórios"]
    ],
    setupLabel: "Implementação", setupVal: "R$ 200", setupNote: "Taxa única · configuração completa",
    monthLabel: "Mensalidade", monthVal: 'R$ 50<small>/mês</small>', monthNote: "Acesso + atualizações"
  },
  es: {
    chip: "24h · 7 días", kicker: "Agente de IA para Instagram",
    title: 'Tu Instagram <span class="hl">atendiendo y vendiendo</span> 24 horas',
    lead: "Una inteligencia artificial entrenada en tu negocio responde a tus clientes en el Direct y en los comentarios — al instante, todos los días.",
    features: [
      ["💬", "Respuestas en el Direct", "Conoce tus productos y precios"],
      ["👋", "Bienvenida automática", "Para cada nuevo contacto"],
      ["💭", "Comentarios respondidos", "E invitación al Direct"],
      ["🎯", "Captación de clientes", "Nombre, interés e historial"],
      ["📲", "Atención humana", "Deriva a tu WhatsApp"],
      ["📊", "Panel completo", "Conversaciones, clientes e informes"]
    ],
    setupLabel: "Implementación", setupVal: "Gs. 224.000", setupNote: "Pago único · configuración completa",
    monthLabel: "Mensualidad", monthVal: 'Gs. 56.000<small>/mes</small>', monthNote: "Acceso + actualizaciones"
  },
  en: {
    chip: "24/7", kicker: "AI Agent for Instagram",
    title: 'Your Instagram <span class="hl">answering and selling</span> 24/7',
    lead: "An AI trained on your business replies to customers in DMs and comments — instantly, every single day.",
    features: [
      ["💬", "Instant DM replies", "Knows your products and prices"],
      ["👋", "Automatic welcome", "For every new contact"],
      ["💭", "Comment replies", "Plus an invite to your DMs"],
      ["🎯", "Lead capture", "Name, interest and history"],
      ["📲", "Human handoff", "Sends the chat to your WhatsApp"],
      ["📊", "Full dashboard", "Conversations, leads and reports"]
    ],
    setupLabel: "Setup", setupVal: "US$39", setupNote: "One-time fee · full configuration",
    monthLabel: "Monthly plan", monthVal: 'US$10<small>/month</small>', monthNote: "Access + updates"
  }
};
const lang = new URLSearchParams(location.search).get("lang") || "pt";
const t = T[lang] || T.pt;
document.documentElement.lang = { pt: "pt-BR", es: "es", en: "en-US" }[lang] || "pt-BR";
for (const id of ["chip", "kicker", "lead", "setupLabel", "setupNote", "monthLabel", "monthNote"]) document.getElementById(id).textContent = t[id];
for (const id of ["title", "setupVal", "monthVal"]) document.getElementById(id).innerHTML = t[id];
document.getElementById("features").innerHTML = t.features
  .map(([ic, b, d]) => `<li><div class="ic">${ic}</div><div><b>${b}</b><span class="d">${d}</span></div></li>`).join("");
</script>
</body>
</html>
