# Seafile — solução tipo "Google Drive" para os arquivos das empresas.
#
# Roda separado do AtendeFlow (stack independente), mas na mesma VPS.
# O banco (seafile-db) e o memcached ficam numa rede interna isolada,
# só o serviço "seafile" entra na rede externa "coolify" pra ser
# alcançado pelo túnel Cloudflare — evitando o mesmo tipo de colisão de
# nome que já derrubou o Redis do AtendeFlow (ver docs/MANUAL_TECNICO.md,
# seção 39): por isso os container_name aqui são todos únicos e
# prefixados com "confianza-".
#
# Dados ficam em disco local (/srv/seafile-data, partição dedicada de
# 240GB), não em compartilhamento de rede — mais rápido e confiável que
# o NAS via SMB pra um banco de dados/servidor de arquivos.

networks:
  seafile-internal:
    name: seafile-internal
  coolify:
    external: true

services:
  seafile-db:
    image: mariadb:10.11
    container_name: confianza-seafile-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SEAFILE_DB_ROOT_PASSWORD}
    volumes:
      - /srv/seafile-data/mysql:/var/lib/mysql
    networks:
      - seafile-internal
    # Só fica "healthy" quando o MariaDB aceita login de verdade (não apenas
    # quando o container existe). Usa TCP em 127.0.0.1 de propósito: durante
    # a inicialização o entrypoint sobe um servidor temporário só por socket,
    # que não deve contar como "pronto". O seafile espera por isso no
    # depends_on abaixo — antes, o Seahub podia subir antes do banco e
    # falhar com "Seahub failed to start" (502 na Cloudflare).
    healthcheck:
      test: ["CMD-SHELL", 'mariadb -h127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  seafile-memcached:
    image: memcached:1.6.29
    container_name: confianza-seafile-memcached
    restart: unless-stopped
    entrypoint: memcached -m 256
    networks:
      seafile-internal:
        # O Seahub não respeita a variável MEMCACHED_HOST/MEMCACHED_PORT
        # (só o DB_HOST é de fato configurável) e sempre tenta resolver
        # o hostname fixo "memcached". Como essa rede é isolada só desse
        # stack (não é a "coolify" compartilhada), dar esse alias aqui é
        # seguro e não repete o problema de colisão do Redis (seção 39
        # do manual).
        aliases:
          - memcached

  seafile:
    image: seafileltd/seafile-mc:12.0-latest
    container_name: confianza-seafile
    restart: unless-stopped
    depends_on:
      seafile-db:
        condition: service_healthy
      seafile-memcached:
        condition: service_started
    environment:
      DB_HOST: confianza-seafile-db
      DB_ROOT_PASSWD: ${SEAFILE_DB_ROOT_PASSWORD}
      TIME_ZONE: America/Asuncion
      SEAFILE_ADMIN_EMAIL: ${SEAFILE_ADMIN_EMAIL}
      SEAFILE_ADMIN_PASSWORD: ${SEAFILE_ADMIN_PASSWORD}
      SEAFILE_SERVER_HOSTNAME: ${SEAFILE_SERVER_HOSTNAME}
      SEAFILE_SERVER_PROTOCOL: https
      JWT_PRIVATE_KEY: ${SEAFILE_JWT_PRIVATE_KEY}
    volumes:
      - /srv/seafile-data/seafile:/shared
    networks:
      - seafile-internal
      - coolify
