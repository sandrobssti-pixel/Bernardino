services:
  postgres:
    image: postgres:16-alpine
    container_name: atendeflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atendeflow
      POSTGRES_PASSWORD: atendeflow
      POSTGRES_DB: atendeflow
    ports:
      - "5432:5432"
    volumes:
      - atendeflow_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: atendeflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - atendeflow_redisdata:/data

volumes:
  atendeflow_pgdata:
  atendeflow_redisdata:
