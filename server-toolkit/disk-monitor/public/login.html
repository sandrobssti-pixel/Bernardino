<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Disk Monitor</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<style>
  :root {
    --bg: #0f172a;
    --panel: #1a2234;
    --panel-border: rgba(148,163,184,0.15);
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --crit: #ef4444;
    --accent: #7c5cf5;
    --accent2: #22d3ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 340px;
  }
  .card img { height: 40px; display: block; margin: 0 auto 20px; }
  h1 { font-size: 1rem; text-align: center; margin: 0 0 24px; color: var(--text-muted); font-weight: 500; }
  label { display: block; font-size: 0.8rem; color: var(--text-muted); margin: 12px 0 4px; }
  input {
    width: 100%;
    background: rgba(148,163,184,0.08);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 10px;
    color: var(--text);
    font-size: 0.9rem;
  }
  button {
    width: 100%;
    margin-top: 20px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error {
    color: var(--crit);
    font-size: 0.85rem;
    margin-top: 12px;
    text-align: center;
    display: none;
  }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <img src="/logo.png" alt="Confiança Technologies" />
    <h1>Disk Monitor — server-toolkit</h1>
    <label for="username">Usuário</label>
    <input type="text" id="username" autocomplete="username" required />
    <label for="password">Senha</label>
    <input type="password" id="password" autocomplete="current-password" required />
    <button type="submit" id="submitBtn">Entrar</button>
    <div class="error" id="errorMsg"></div>
  </form>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const errorEl = document.getElementById("errorMsg");
  errorEl.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Entrando...";
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value
      })
    });
    if (!res.ok) {
      throw new Error("Usuário ou senha inválidos.");
    }
    window.location.href = "/index.html";
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Entrar";
  }
});
</script>
</body>
</html>
