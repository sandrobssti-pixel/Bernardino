<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NAS Panel — Confiança Technologies</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<style>
  :root {
    --bg: #0f172a;
    --panel: #1a2234;
    --panel-border: rgba(148,163,184,0.15);
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --ok: #22c55e;
    --warn: #f59e0b;
    --crit: #ef4444;
    --accent: #7c5cf5;
    --accent2: #22d3ee;
  }
  :root[data-theme="light"] {
    --bg: #f1f5f9;
    --panel: #ffffff;
    --panel-border: rgba(15,23,42,0.08);
    --text: #0f172a;
    --text-muted: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .topbar .brand { display: flex; align-items: center; gap: 16px; }
  .topbar img { height: 36px; }
  .topbar .title { display: flex; flex-direction: column; }
  .topbar .title strong { font-size: 1rem; }
  .topbar .title span { font-size: 0.8rem; color: var(--text-muted); }
  .topbar .controls { display: flex; align-items: center; gap: 8px; }
  .icon-btn, .lang-select, select {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .version-badge {
    font-size: 0.7rem; color: var(--text-muted);
    border: 1px solid var(--panel-border); border-radius: 999px;
    padding: 2px 8px; margin-left: 8px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-muted); margin: 0 0 12px;
  }
  .sub { color: var(--text-muted); font-size: 0.85rem; }
  button {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #fff; border: none; border-radius: 8px;
    padding: 10px 16px; font-size: 0.9rem; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: rgba(148,163,184,0.15); color: var(--text); }
  .roots-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .root-btn {
    background: rgba(148,163,184,0.1); color: var(--text);
    border: 1px solid var(--panel-border); border-radius: 999px;
    padding: 6px 14px; font-size: 0.85rem; cursor: pointer;
  }
  .root-btn.active { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; border-color: transparent; }
  .root-btn.unmounted { opacity: 0.5; }
  .breadcrumb { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
  .breadcrumb a { color: var(--accent2); cursor: pointer; text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--panel-border); }
  th { color: var(--text-muted); font-weight: 600; }
  tr.entry-row:hover { background: rgba(148,163,184,0.06); }
  .entry-name { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .entry-name.file { cursor: default; }
  .entry-icon { color: var(--accent2); flex-shrink: 0; }
  .upload-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  #toast {
    position: fixed; bottom: 16px; right: 16px;
    background: var(--panel); border: 1px solid var(--panel-border);
    padding: 10px 16px; border-radius: 8px; display: none; max-width: 320px;
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <img id="brandLogo" src="/logo.png" alt="Confiança Technologies" />
      <div class="title">
        <strong data-i18n="appTitle">NAS Panel</strong>
        <span data-i18n="appSubtitle">Confiança Technologies — server-toolkit</span>
      </div>
      <span class="version-badge" id="versionBadge">v1.0.0</span>
    </div>
    <div class="controls">
      <span class="sub" id="userInfo"></span>
      <select class="lang-select" id="langSelect">
        <option value="pt">🇧🇷 Português</option>
        <option value="es">🇵🇾 Español</option>
        <option value="en">🇺🇸 English</option>
      </select>
      <button class="icon-btn" id="themeToggle" type="button">🌙</button>
      <button class="icon-btn" id="logoutBtn" type="button" data-i18n="logout">Sair</button>
    </div>
  </div>

  <div class="panel">
    <h2 data-i18n="filesTitle">Arquivos do NAS</h2>
    <div class="roots-row" id="rootsRow"></div>
    <div class="breadcrumb" id="breadcrumb"></div>
    <table>
      <thead>
        <tr>
          <th data-i18n="thName">Nome</th>
          <th data-i18n="thSize">Tamanho</th>
          <th data-i18n="thModified">Modificado</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="entriesBody"></tbody>
    </table>
    <div class="upload-row" id="uploadRow" style="display:none">
      <input type="file" id="uploadInput" />
      <button id="uploadBtn" data-i18n="uploadBtn">Enviar arquivo</button>
      <span class="sub" id="uploadStatus"></span>
    </div>
  </div>

  <div id="toast"></div>

<script>
// ---------- i18n ----------
const LOCALE_MAP = { pt: "pt-BR", es: "es-PY", en: "en-US" };

const translations = {
  pt: {
    appTitle: "NAS Panel",
    appSubtitle: "Confiança Technologies — server-toolkit",
    loading: "carregando...",
    logout: "Sair",
    loggedInAs: (user, role) => `${user} (${role === "admin" ? "admin" : "visualizador"})`,
    filesTitle: "Arquivos do NAS",
    thName: "Nome", thSize: "Tamanho", thModified: "Modificado",
    uploadBtn: "Enviar arquivo",
    downloadBtn: "Baixar",
    rootUnmounted: "não montada",
    emptyFolder: "Pasta vazia.",
    toastUploadOk: "Arquivo enviado.",
    toastUploadErr: msg => `Erro no envio: ${msg}`,
    toastBrowseErr: msg => `Erro ao abrir pasta: ${msg}`,
    viewerNotice: "Seu acesso é só de visualização — só um administrador pode enviar arquivos.",
    rootRoot: "Início"
  },
  es: {
    appTitle: "NAS Panel",
    appSubtitle: "Confiança Technologies — server-toolkit",
    loading: "cargando...",
    logout: "Salir",
    loggedInAs: (user, role) => `${user} (${role === "admin" ? "admin" : "visualizador"})`,
    filesTitle: "Archivos del NAS",
    thName: "Nombre", thSize: "Tamaño", thModified: "Modificado",
    uploadBtn: "Enviar archivo",
    downloadBtn: "Descargar",
    rootUnmounted: "no montada",
    emptyFolder: "Carpeta vacía.",
    toastUploadOk: "Archivo enviado.",
    toastUploadErr: msg => `Error al enviar: ${msg}`,
    toastBrowseErr: msg => `Error al abrir carpeta: ${msg}`,
    viewerNotice: "Su acceso es solo de visualización — solo un administrador puede enviar archivos.",
    rootRoot: "Inicio"
  },
  en: {
    appTitle: "NAS Panel",
    appSubtitle: "Confiança Technologies — server-toolkit",
    loading: "loading...",
    logout: "Log out",
    loggedInAs: (user, role) => `${user} (${role === "admin" ? "admin" : "viewer"})`,
    filesTitle: "NAS files",
    thName: "Name", thSize: "Size", thModified: "Modified",
    uploadBtn: "Upload file",
    downloadBtn: "Download",
    rootUnmounted: "not mounted",
    emptyFolder: "Empty folder.",
    toastUploadOk: "File uploaded.",
    toastUploadErr: msg => `Upload error: ${msg}`,
    toastBrowseErr: msg => `Error opening folder: ${msg}`,
    viewerNotice: "Your access is view-only — only an administrator can upload files.",
    rootRoot: "Home"
  }
};

let currentLang = localStorage.getItem("np-lang") || "pt";
function t(key, ...args) {
  const entry = (translations[currentLang] || translations.pt)[key];
  return typeof entry === "function" ? entry(...args) : entry;
}

function applyTranslations() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    const value = t(key);
    if (typeof value === "string") el.textContent = value;
  });
  document.documentElement.lang = LOCALE_MAP[currentLang] || "pt-BR";
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem("np-lang", lang);
  document.getElementById("langSelect").value = lang;
  applyTranslations();
  renderRoots();
  loadCurrentFolder();
}

// ---------- tema claro/escuro ----------
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("themeToggle").textContent = theme === "light" ? "☀️" : "🌙";
  document.getElementById("brandLogo").src = theme === "light" ? "/logo-light.png" : "/logo.png";
}

function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme") || "dark";
  const next = current === "light" ? "dark" : "light";
  localStorage.setItem("np-theme", next);
  applyTheme(next);
}

// ---------- auth ----------
let currentUserInfo = null;

async function apiFetch(url, options) {
  const res = await fetch(url, options);
  if (res.status === 401) {
    window.location.href = "/login.html";
    throw new Error("not authenticated");
  }
  return res;
}

function applyRoleUI() {
  const isAdmin = currentUserInfo?.role === "admin";
  document.getElementById("userInfo").textContent = t("loggedInAs", currentUserInfo.username, currentUserInfo.role);
  document.getElementById("uploadRow").style.display = isAdmin ? "flex" : "none";
}

async function checkAuth() {
  const res = await fetch("/api/me");
  if (!res.ok) {
    window.location.href = "/login.html";
    return false;
  }
  currentUserInfo = await res.json();
  applyRoleUI();
  return true;
}

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await fetch("/api/logout", { method: "POST" });
  window.location.href = "/login.html";
});

// ---------- navegador de arquivos ----------
let roots = [];
let currentRootKey = null;
let currentPath = "";

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 3500);
}

function formatBytes(bytes) {
  if (bytes === null || bytes === undefined) return "";
  const gb = bytes / 1024 / 1024 / 1024;
  if (gb >= 1) return gb.toFixed(1) + " GB";
  const mb = bytes / 1024 / 1024;
  if (mb >= 1) return mb.toFixed(1) + " MB";
  return Math.max(1, Math.round(bytes / 1024)) + " KB";
}

function renderRoots() {
  const row = document.getElementById("rootsRow");
  row.innerHTML = roots.map(r => `
    <button type="button" class="root-btn ${r.key === currentRootKey ? "active" : ""} ${r.mounted ? "" : "unmounted"}"
      data-root="${r.key}" ${r.mounted ? "" : "disabled"}>
      ${r.label}${r.mounted ? "" : " (" + t("rootUnmounted") + ")"}
    </button>
  `).join("");
  row.querySelectorAll("[data-root]").forEach(btn => {
    btn.addEventListener("click", () => {
      currentRootKey = btn.getAttribute("data-root");
      currentPath = "";
      loadCurrentFolder();
    });
  });
}

function renderBreadcrumb() {
  const root = roots.find(r => r.key === currentRootKey);
  const parts = currentPath ? currentPath.split("/").filter(Boolean) : [];
  const crumbs = [`<a data-path="">${root ? root.label : t("rootRoot")}</a>`];
  let accPath = "";
  parts.forEach(part => {
    accPath = accPath ? accPath + "/" + part : part;
    crumbs.push(`<a data-path="${accPath}">${part}</a>`);
  });
  const el = document.getElementById("breadcrumb");
  el.innerHTML = crumbs.join(" / ");
  el.querySelectorAll("[data-path]").forEach(a => {
    a.addEventListener("click", () => {
      currentPath = a.getAttribute("data-path");
      loadCurrentFolder();
    });
  });
}

function renderEntries(entries) {
  const body = document.getElementById("entriesBody");
  if (!entries.length) {
    body.innerHTML = `<tr><td colspan="4" class="sub">${t("emptyFolder")}</td></tr>`;
    return;
  }
  body.innerHTML = entries.map(e => `
    <tr class="entry-row">
      <td>
        <span class="entry-name ${e.isDir ? "" : "file"}" data-entry="${encodeURIComponent(e.name)}" data-isdir="${e.isDir}">
          <span class="entry-icon">${e.isDir ? "📁" : "📄"}</span> ${e.name}
        </span>
      </td>
      <td>${formatBytes(e.sizeBytes)}</td>
      <td>${new Date(e.modifiedAt).toLocaleString(LOCALE_MAP[currentLang] || "pt-BR")}</td>
      <td>${e.isDir ? "" : `<button class="secondary" data-download="${encodeURIComponent(e.name)}">${t("downloadBtn")}</button>`}</td>
    </tr>
  `).join("");

  body.querySelectorAll("[data-entry]").forEach(el => {
    const isDir = el.getAttribute("data-isdir") === "true";
    if (!isDir) return;
    el.addEventListener("click", () => {
      const name = decodeURIComponent(el.getAttribute("data-entry"));
      currentPath = currentPath ? currentPath + "/" + name : name;
      loadCurrentFolder();
    });
  });

  body.querySelectorAll("[data-download]").forEach(btn => {
    btn.addEventListener("click", () => {
      const name = decodeURIComponent(btn.getAttribute("data-download"));
      const filePath = currentPath ? currentPath + "/" + name : name;
      window.location.href = `/api/download?root=${encodeURIComponent(currentRootKey)}&path=${encodeURIComponent(filePath)}`;
    });
  });
}

async function loadCurrentFolder() {
  renderBreadcrumb();
  if (!currentRootKey) return;
  try {
    const res = await apiFetch(`/api/browse?root=${encodeURIComponent(currentRootKey)}&path=${encodeURIComponent(currentPath)}`);
    const data = await res.json();
    if (!res.ok) {
      toast(t("toastBrowseErr", data.error));
      return;
    }
    renderEntries(data.entries);
  } catch (err) {
    console.error(err);
  }
}

document.getElementById("uploadBtn").addEventListener("click", async () => {
  const input = document.getElementById("uploadInput");
  if (!input.files.length) return;
  const statusEl = document.getElementById("uploadStatus");
  const form = new FormData();
  // "root"/"path" ANTES do arquivo — o backend (multer) depende dessa
  // ordem pra já saber o destino quando processa o campo do arquivo.
  form.append("root", currentRootKey);
  form.append("path", currentPath);
  form.append("file", input.files[0]);

  statusEl.textContent = t("loading");
  try {
    const res = await apiFetch("/api/upload", { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok) {
      toast(t("toastUploadErr", data.error));
    } else {
      toast(t("toastUploadOk"));
      input.value = "";
      loadCurrentFolder();
    }
  } catch (err) {
    toast(t("toastUploadErr", err.message));
  } finally {
    statusEl.textContent = "";
  }
});

async function loadRoots() {
  const res = await apiFetch("/api/roots");
  const data = await res.json();
  roots = data.roots;
  if (data.version) document.getElementById("versionBadge").textContent = "v" + data.version;
  if (!currentRootKey) {
    const firstMounted = roots.find(r => r.mounted);
    currentRootKey = firstMounted ? firstMounted.key : (roots[0] && roots[0].key);
  }
  renderRoots();
}

document.getElementById("langSelect").addEventListener("change", e => setLang(e.target.value));
document.getElementById("themeToggle").addEventListener("click", toggleTheme);

// ---------- boot ----------
applyTheme(localStorage.getItem("np-theme") || "dark");
document.getElementById("langSelect").value = currentLang;
applyTranslations();
(async () => {
  const authenticated = await checkAuth();
  if (!authenticated) return;
  await loadRoots();
  await loadCurrentFolder();
})();
</script>
</body>
</html>
